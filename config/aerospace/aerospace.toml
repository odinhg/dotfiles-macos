config-version = 2
start-at-login = true 
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

exec-on-workspace-change = ['/bin/bash', '-c',
    '/run/current-system/sw/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

[gaps]
inner.horizontal = 2
inner.vertical = 2
outer.left = 1
outer.right = 1
outer.top = 1 
outer.bottom = 1

[mode.main.binding]
alt-h = 'focus left'
alt-j = 'focus down'
alt-k = 'focus up'
alt-l = 'focus right'
alt-shift-h = 'move left'
alt-shift-j = 'move down'
alt-shift-k = 'move up'
alt-shift-l = 'move right'
alt-f = 'fullscreen'
alt-slash = 'layout tiles horizontal vertical'
alt-minus = 'resize smart -50'
alt-equal = 'resize smart +50'

alt-1 = 'workspace 1'
alt-2 = 'workspace 2'
alt-3 = 'workspace 3'
alt-4 = 'workspace 4'
alt-5 = 'workspace 5'
alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget /run/current-system/sw/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget /run/current-system/sw/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget /run/current-system/sw/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget /run/current-system/sw/bin/sketchybar --trigger aerospace_workspace_change']
alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget /run/current-system/sw/bin/sketchybar --trigger aerospace_workspace_change']

alt-tab = 'workspace-back-and-forth'
alt-shift-c = 'reload-config'

# Workspace 1 terminal and editor, 2 browser, 3 chat, 4 office, 5 media and graphics
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'net.sourceforge.skim-app.skim'
run = 'move-node-to-workspace 1'

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = 'move-node-to-workspace 2'

[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = 'move-node-to-workspace 3'

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.microsoft.Outlook'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.microsoft.Word'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.microsoft.Excel'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.microsoft.Powerpoint'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'us.zoom.xos'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.citrix.receiver.nomas'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.apple.Pages'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.apple.Numbers'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.apple.Keynote'
run = 'move-node-to-workspace 4'

[[on-window-detected]]
if.app-id = 'com.spotify.client'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'org.videolan.vlc'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'org.inkscape.Inkscape'
run = 'move-node-to-workspace 5'

[[on-window-detected]]
if.app-id = 'org.gimp.gimp'
run = 'move-node-to-workspace 5'

# Floats over whatever workspace is active
[[on-window-detected]]
if.app-id = 'com.bitwarden.desktop'
run = 'layout floating'
