# Prefix stays at the default Ctrl-b. Reload this file with prefix + r.

# True color and undercurl in Ghostty and Neovim.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-ghostty:usstyle"

# Pass modified keys like Shift-Enter through to Neovim and Claude Code.
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",xterm-ghostty:extkeys"

# No delay after Esc (Neovim feels laggy otherwise), and let Neovim
# see focus changes so autoread works.
set -sg escape-time 0
set -g focus-events on

set -g mouse on
set -g history-limit 50000

# Switch to another session instead of detaching when one is closed.
set -g detach-on-destroy off

# Number windows and panes from 1 to match the keyboard, and close gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Copies reach the macOS clipboard via OSC 52, also over SSH.
set -s set-clipboard on

# Vim keys in copy mode; v selects, C-v toggles block selection, y copies.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel

# Split with | and -, keeping the current directory.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Move between panes with h j k l, resize with H J K L.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# l is taken by pane movement, so jump to the last window with Tab.
bind Tab last-window

bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# Status bar in Ghostty's palette, with square blocks. The session block
# turns yellow while prefix is held.
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#1d2338,fg=#c8c3b0"
set -g status-left-length 40
set -g status-right-length 80

set -g status-left "#{?client_prefix,#[bg=#e0af68],#[bg=#7aa2f7]}#[fg=#11172b,bold] #S #[bg=default,nobold]  "

setw -g window-status-separator " "
setw -g window-status-format "#[bg=#3b4366,fg=#c8c3b0] #I #W#{?window_zoomed_flag, 󰊓,} #[bg=default]"
setw -g window-status-current-format "#[bg=#bb9af7,fg=#11172b,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[bg=default,nobold]"

set -g status-right "#[fg=#7dcfff] #{b:pane_current_path}  #[bg=#3b4366,fg=#f2e8cf] 󰥔 %H:%M #[bg=default]"

set -g pane-border-style "fg=#3b4366"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#1d2338,fg=#e0af68"
set -g message-command-style "bg=#1d2338,fg=#e0af68"
setw -g mode-style "bg=#2a3a6b,fg=#f2e8cf"
